<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图片修剪</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>图片修剪</h1>
      <div class="scanner-container">
        <video id="camera" autoplay playsinline></video>
        <canvas id="photoCanvas" style="display: none"></canvas>
        <div class="button-group">
          <input type="file" id="fileInput" accept="image/*" style="display: none" />
          <button id="uploadBtn">上传图片</button>
          <button id="captureBtn">拍摄</button>
          <button id="confirmBtn" style="display: none">确认裁剪</button>
          <button id="saveBtn" disabled>保存</button>
          <button id="downloadBtn" disabled>下载PDF</button>
        </div>
      </div>
      <div id="preview" class="preview-container"></div>
      <h2 class="history-title">历史图片</h2>
      <div id="imageHistory" class="image-history"></div>
    </div>
    <script src="https://unpkg.com/opencv.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
